[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "edge-vlm-perception"
version = "1.0.0"
description = "Multi-Modal Vision-Language Edge Perception System for NVIDIA Jetson & Robotics"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Bernard B. Das", email = "bernard@example.com" }
]
dependencies = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "opencv-python-headless>=4.9.0",
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "onnxruntime>=1.18.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pyyaml>=6.0",
    "pydantic>=2.7.0",
    "click>=8.1.7",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.4",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",
]

[project.scripts]
edge-perception = "src.main:run_server"
edge-cli = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
